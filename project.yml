name: LocalFlow
options:
  bundleIdPrefix: com.localflow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LocalFlow:
    type: application
    platform: macOS
    sources:
      - LocalFlow
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: GRDB
        product: GRDB
    info:
      path: LocalFlow/Info.plist
      properties:
        CFBundleDisplayName: LocalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: LocalFlow records your voice while you hold the dictation keys and transcribes it on this Mac. Audio never leaves your computer.
    entitlements:
      path: LocalFlow/LocalFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localflow.app
        PRODUCT_NAME: LocalFlow
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Set by scripts/build.sh from your Apple Development certificate (see PLAN §8).
        DEVELOPMENT_TEAM: ${LOCALFLOW_TEAM_ID}
        COMBINE_HIDPI_IMAGES: true
