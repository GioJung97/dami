name: Dami
options:
  bundleIdPrefix: io.github.giojung97
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  DamiCore:
    path: DamiCore
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Dami:
    type: application
    platform: macOS
    sources:
      - Dami
    dependencies:
      - package: DamiCore
      - package: ArgmaxOSS
        product: WhisperKit
      - package: GRDB
        product: GRDB
    info:
      path: Dami/Info.plist
      properties:
        CFBundleDisplayName: Dami
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Dami records your voice while you hold the dictation keys and transcribes it on this Mac. Audio never leaves your computer.
    entitlements:
      path: Dami/Dami.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.giojung97.dami
        PRODUCT_NAME: Dami
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Set by scripts/build.sh from your Apple Development certificate (see PLAN §8).
        DEVELOPMENT_TEAM: ${DAMI_TEAM_ID}
        COMBINE_HIDPI_IMAGES: true
